<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620">
<style>
text { font-family: Arial, Helvetica, sans-serif; }
</style>
<defs>
<marker id="arrow-primary" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0,0 10,4 0,8" fill="#3b6ea8"/></marker>
<marker id="arrow-output" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0,0 10,4 0,8" fill="#2e7d32"/></marker>
</defs>
<rect width="1200" height="620" fill="#ffffff"/>
<text x="60" y="58" font-size="28" font-weight="700" fill="#111827">MODULE 5 — HIERARCHICAL SUMMARIZATION</text>
<text x="60" y="88" font-size="17" fill="#6b7280">BARTpho topic titling</text>
<line x1="60" y1="108" x2="1140" y2="108" stroke="#1f3a5f" stroke-width="2"/>
<g data-stage="ordered-summaries" data-order="0">
<rect x="20" y="180" width="130" height="125" rx="10" fill="#f8fafc" stroke="#1f3a5f" stroke-width="2"/>
<text x="38" y="211" text-anchor="start" font-size="16" font-weight="700" fill="#111827"><tspan x="38" dy="0">Ordered Chunk </tspan><tspan x="38" dy="18">Summaries</tspan></text>
</g>
<g data-stage="all-summaries-ready" data-order="0">
<rect x="165" y="180" width="135" height="125" rx="10" fill="#f8fafc" stroke="#1f3a5f" stroke-width="2"/>
<text x="183" y="211" text-anchor="start" font-size="16" font-weight="700" fill="#111827"><tspan x="183" dy="0">All summaries </tspan><tspan x="183" dy="18">ready</tspan></text>
<rect x="171" y="186" width="123" height="113" rx="7" fill="none" stroke="#1f3a5f" stroke-width="1"/>
</g>
<g data-stage="join" data-order="1">
<rect x="315" y="180" width="110" height="125" rx="10" fill="#f8fafc" stroke="#1f3a5f" stroke-width="2"/>
<circle cx="337" cy="202" r="13" fill="#1f3a5f" data-step="1"/>
<text x="337" y="207" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">1</text>
<text x="370" y="235" text-anchor="middle" font-size="14" font-weight="700" fill="#111827"><tspan x="370" dy="0">Join with </tspan><tspan x="370" dy="18">&quot; / &quot;</tspan></text>
</g>
<g data-stage="truncate" data-order="2">
<rect x="440" y="180" width="150" height="125" rx="10" fill="#f8fafc" stroke="#1f3a5f" stroke-width="2"/>
<circle cx="462" cy="202" r="13" fill="#1f3a5f" data-step="2"/>
<text x="462" y="207" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">2</text>
<text x="515" y="235" text-anchor="middle" font-size="14" font-weight="700" fill="#111827"><tspan x="515" dy="0">Keep Last 1,500 </tspan><tspan x="515" dy="18">Characters</tspan></text>
</g>
<g data-stage="prefix" data-order="3">
<rect x="605" y="180" width="110" height="125" rx="10" fill="#f8fafc" stroke="#1f3a5f" stroke-width="2"/>
<circle cx="627" cy="202" r="13" fill="#1f3a5f" data-step="3"/>
<text x="627" y="207" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">3</text>
<text x="660" y="235" text-anchor="middle" font-size="14" font-weight="700" fill="#111827"><tspan x="660" dy="0">Add Task </tspan><tspan x="660" dy="18">Prefix</tspan></text>
</g>
<g data-stage="tokenization" data-order="4">
<rect x="730" y="180" width="115" height="125" rx="10" fill="#f8fafc" stroke="#1f3a5f" stroke-width="2"/>
<circle cx="752" cy="202" r="13" fill="#1f3a5f" data-step="4"/>
<text x="752" y="207" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">4</text>
<text x="787" y="235" text-anchor="middle" font-size="14" font-weight="700" fill="#111827"><tspan x="787" dy="0">Tokenization</tspan></text>
</g>
<g data-stage="bartpho-inference" data-order="5">
<rect x="860" y="180" width="190" height="125" rx="10" fill="#f8fafc" stroke="#1f3a5f" stroke-width="2"/>
<circle cx="882" cy="202" r="13" fill="#1f3a5f" data-step="5"/>
<text x="882" y="207" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">5</text>
<text x="955" y="235" text-anchor="middle" font-size="14" font-weight="700" fill="#111827"><tspan x="955" dy="0">Fine-tuned </tspan><tspan x="955" dy="18">BARTpho-syllable-base</tspan></text>
</g>
<g data-stage="topic-title" data-order="6">
<rect x="1065" y="180" width="115" height="125" rx="10" fill="#f0fdf4" stroke="#2e7d32" stroke-width="2"/>
<text x="1083" y="211" text-anchor="start" font-size="16" font-weight="700" fill="#111827"><tspan x="1083" dy="0">Topic </tspan><tspan x="1083" dy="18">Title</tspan></text>
</g>
<line x1="150" y1="242" x2="165" y2="242" stroke="#3b6ea8" stroke-width="2.5" marker-end="url(#arrow-primary)"/>
<line x1="300" y1="242" x2="315" y2="242" stroke="#3b6ea8" stroke-width="2.5" marker-end="url(#arrow-primary)"/>
<line x1="425" y1="242" x2="440" y2="242" stroke="#3b6ea8" stroke-width="2.5" marker-end="url(#arrow-primary)"/>
<line x1="590" y1="242" x2="605" y2="242" stroke="#3b6ea8" stroke-width="2.5" marker-end="url(#arrow-primary)"/>
<line x1="715" y1="242" x2="730" y2="242" stroke="#3b6ea8" stroke-width="2.5" marker-end="url(#arrow-primary)"/>
<line x1="845" y1="242" x2="860" y2="242" stroke="#3b6ea8" stroke-width="2.5" marker-end="url(#arrow-primary)"/>
<line x1="1050" y1="242" x2="1065" y2="242" stroke="#2e7d32" stroke-width="2.5" marker-end="url(#arrow-output)"/>
<rect x="50" y="405" width="1100" height="130" rx="10" fill="#f8fafc" stroke="#1f3a5f" stroke-width="2"/>
<text x="68" y="435" text-anchor="start" font-size="18" font-weight="700" fill="#1f3a5f">Decoding constraints</text>
<line x1="68" y1="449" x2="1132" y2="449" stroke="#1f3a5f" stroke-width="1" opacity="0.35"/>
<g data-constraint-footer="bartpho">
<rect x="95" y="475" width="210" height="34" rx="17" fill="#f8fafc" stroke="#1f3a5f" stroke-width="1.5"/>
<text x="200" y="498" text-anchor="middle" font-size="14" fill="#6b7280">max input: 1,024 tokens</text>
<rect x="315" y="475" width="150" height="34" rx="17" fill="#f8fafc" stroke="#1f3a5f" stroke-width="1.5"/>
<text x="390" y="498" text-anchor="middle" font-size="14" fill="#6b7280">beam size: 4</text>
<rect x="475" y="475" width="150" height="34" rx="17" fill="#f8fafc" stroke="#1f3a5f" stroke-width="1.5"/>
<text x="550" y="498" text-anchor="middle" font-size="14" fill="#6b7280">no sampling</text>
<rect x="635" y="475" width="190" height="34" rx="17" fill="#f8fafc" stroke="#1f3a5f" stroke-width="1.5"/>
<text x="730" y="498" text-anchor="middle" font-size="14" fill="#6b7280">no-repeat 3-gram</text>
<rect x="835" y="475" width="240" height="34" rx="17" fill="#f8fafc" stroke="#1f3a5f" stroke-width="1.5"/>
<text x="955" y="498" text-anchor="middle" font-size="14" fill="#6b7280">max output: 200 tokens</text>
</g>
</svg>
