<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620">
<style>
text { font-family: Arial, Helvetica, sans-serif; }
</style>
<defs>
<marker id="arrow-primary" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0,0 10,4 0,8" fill="#3b6ea8"/></marker>
<marker id="arrow-output" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0,0 10,4 0,8" fill="#2e7d32"/></marker>
</defs>
<rect width="1200" height="620" fill="#ffffff"/>
<text x="60" y="58" font-size="22" font-weight="700" fill="#111827">MODULE 5 — HIERARCHICAL SUMMARIZATION</text>
<text x="60" y="86" font-size="14" fill="#6b7280">BARTpho topic titling</text>
<line x1="60" y1="108" x2="1140" y2="108" stroke="#1f3a5f" stroke-width="2"/>
<g data-stage="ordered-summaries" data-order="1">
<rect x="25" y="180" width="135" height="125" rx="10" fill="#f8fafc" stroke="#1f3a5f" stroke-width="2"/>
<circle cx="47" cy="202" r="13" fill="#1f3a5f"/>
<text x="47" y="207" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">1</text>
<text x="92" y="235" text-anchor="middle" font-size="12" font-weight="700" fill="#111827"><tspan x="92" dy="0">Ordered Chunk </tspan><tspan x="92" dy="18">Summaries</tspan></text>
</g>
<g data-stage="all-summaries-ready" data-order="2">
<rect x="180" y="180" width="140" height="125" rx="10" fill="#f8fafc" stroke="#1f3a5f" stroke-width="2"/>
<circle cx="202" cy="202" r="13" fill="#1f3a5f"/>
<text x="202" y="207" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">2</text>
<text x="250" y="235" text-anchor="middle" font-size="12" font-weight="700" fill="#111827"><tspan x="250" dy="0">All summaries </tspan><tspan x="250" dy="18">ready</tspan></text>
<rect x="186" y="186" width="128" height="113" rx="7" fill="none" stroke="#1f3a5f" stroke-width="1"/>
</g>
<g data-stage="join" data-order="3">
<rect x="340" y="180" width="105" height="125" rx="10" fill="#f8fafc" stroke="#1f3a5f" stroke-width="2"/>
<circle cx="362" cy="202" r="13" fill="#1f3a5f"/>
<text x="362" y="207" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">3</text>
<text x="392" y="235" text-anchor="middle" font-size="12" font-weight="700" fill="#111827"><tspan x="392" dy="0">Join with </tspan><tspan x="392" dy="18">&quot; / &quot;</tspan></text>
</g>
<g data-stage="truncate" data-order="4">
<rect x="465" y="180" width="145" height="125" rx="10" fill="#f8fafc" stroke="#1f3a5f" stroke-width="2"/>
<circle cx="487" cy="202" r="13" fill="#1f3a5f"/>
<text x="487" y="207" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">4</text>
<text x="537" y="235" text-anchor="middle" font-size="12" font-weight="700" fill="#111827"><tspan x="537" dy="0">Keep Last 1,500 </tspan><tspan x="537" dy="18">Characters</tspan></text>
</g>
<g data-stage="prefix" data-order="5">
<rect x="630" y="180" width="105" height="125" rx="10" fill="#f8fafc" stroke="#1f3a5f" stroke-width="2"/>
<circle cx="652" cy="202" r="13" fill="#1f3a5f"/>
<text x="652" y="207" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">5</text>
<text x="682" y="235" text-anchor="middle" font-size="12" font-weight="700" fill="#111827"><tspan x="682" dy="0">Add Task </tspan><tspan x="682" dy="18">Prefix</tspan></text>
</g>
<g data-stage="tokenization" data-order="6">
<rect x="755" y="180" width="105" height="125" rx="10" fill="#f8fafc" stroke="#1f3a5f" stroke-width="2"/>
<circle cx="777" cy="202" r="13" fill="#1f3a5f"/>
<text x="777" y="207" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">6</text>
<text x="807" y="235" text-anchor="middle" font-size="12" font-weight="700" fill="#111827"><tspan x="807" dy="0">Tokenization</tspan></text>
</g>
<g data-stage="bartpho-inference" data-order="7">
<rect x="880" y="180" width="180" height="125" rx="10" fill="#f8fafc" stroke="#1f3a5f" stroke-width="2"/>
<circle cx="902" cy="202" r="13" fill="#1f3a5f"/>
<text x="902" y="207" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">7</text>
<text x="970" y="235" text-anchor="middle" font-size="12" font-weight="700" fill="#111827"><tspan x="970" dy="0">Fine-tuned </tspan><tspan x="970" dy="18">BARTpho-syllable-base</tspan></text>
</g>
<g data-stage="topic-title" data-order="8">
<rect x="1080" y="180" width="95" height="125" rx="10" fill="#f0fdf4" stroke="#2e7d32" stroke-width="2"/>
<circle cx="1102" cy="202" r="13" fill="#2e7d32"/>
<text x="1102" y="207" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">8</text>
<text x="1127" y="235" text-anchor="middle" font-size="12" font-weight="700" fill="#111827"><tspan x="1127" dy="0">Topic </tspan><tspan x="1127" dy="18">Title</tspan></text>
</g>
<line x1="160" y1="242" x2="180" y2="242" stroke="#3b6ea8" stroke-width="2.5" marker-end="url(#arrow-primary)"/>
<line x1="320" y1="242" x2="340" y2="242" stroke="#3b6ea8" stroke-width="2.5" marker-end="url(#arrow-primary)"/>
<line x1="445" y1="242" x2="465" y2="242" stroke="#3b6ea8" stroke-width="2.5" marker-end="url(#arrow-primary)"/>
<line x1="610" y1="242" x2="630" y2="242" stroke="#3b6ea8" stroke-width="2.5" marker-end="url(#arrow-primary)"/>
<line x1="735" y1="242" x2="755" y2="242" stroke="#3b6ea8" stroke-width="2.5" marker-end="url(#arrow-primary)"/>
<line x1="860" y1="242" x2="880" y2="242" stroke="#3b6ea8" stroke-width="2.5" marker-end="url(#arrow-primary)"/>
<line x1="1060" y1="242" x2="1080" y2="242" stroke="#2e7d32" stroke-width="2.5" marker-end="url(#arrow-output)"/>
<rect x="50" y="405" width="1100" height="130" rx="10" fill="#f8fafc" stroke="#1f3a5f" stroke-width="2"/>
<text x="68" y="435" text-anchor="start" font-size="15" font-weight="700" fill="#1f3a5f">Decoding constraints</text>
<line x1="68" y1="449" x2="1132" y2="449" stroke="#1f3a5f" stroke-width="1" opacity="0.35"/>
<g data-constraint-footer="bartpho">
<rect x="95" y="475" width="210" height="30" rx="15" fill="#f8fafc" stroke="#1f3a5f" stroke-width="1.5"/>
<text x="200" y="495" text-anchor="middle" font-size="12" fill="#6b7280">max input: 1,024 tokens</text>
<rect x="315" y="475" width="150" height="30" rx="15" fill="#f8fafc" stroke="#1f3a5f" stroke-width="1.5"/>
<text x="390" y="495" text-anchor="middle" font-size="12" fill="#6b7280">beam size: 4</text>
<rect x="475" y="475" width="150" height="30" rx="15" fill="#f8fafc" stroke="#1f3a5f" stroke-width="1.5"/>
<text x="550" y="495" text-anchor="middle" font-size="12" fill="#6b7280">no sampling</text>
<rect x="635" y="475" width="190" height="30" rx="15" fill="#f8fafc" stroke="#1f3a5f" stroke-width="1.5"/>
<text x="730" y="495" text-anchor="middle" font-size="12" fill="#6b7280">no-repeat 3-gram</text>
<rect x="835" y="475" width="240" height="30" rx="15" fill="#f8fafc" stroke="#1f3a5f" stroke-width="1.5"/>
<text x="955" y="495" text-anchor="middle" font-size="12" fill="#6b7280">max output: 200 tokens</text>
</g>
</svg>
