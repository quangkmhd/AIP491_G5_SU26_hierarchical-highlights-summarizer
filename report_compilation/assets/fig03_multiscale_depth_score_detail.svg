<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720">
<style>
text { font-family: Arial, Helvetica, sans-serif; }
</style>
<defs>
<marker id="arrow-primary" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0,0 10,4 0,8" fill="#3b6ea8"/></marker>
<marker id="arrow-output" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0,0 10,4 0,8" fill="#2e7d32"/></marker>
</defs>
<rect width="1200" height="720" fill="#ffffff"/>
<text x="60" y="58" font-size="22" font-weight="700" fill="#111827">MODULE 4 — TOPIC SEGMENTATION</text>
<text x="60" y="86" font-size="14" fill="#6b7280">Multi-scale depth aggregation</text>
<line x1="60" y1="108" x2="1140" y2="108" stroke="#1f3a5f" stroke-width="2"/>
<rect x="50" y="145" width="240" height="385" rx="10" fill="#f8fafc" stroke="#1f3a5f" stroke-width="2"/>
<text x="68" y="175" text-anchor="start" font-size="15" font-weight="700" fill="#1f3a5f">1  Similarity Profile</text>
<line x1="68" y1="189" x2="272" y2="189" stroke="#1f3a5f" stroke-width="1" opacity="0.35"/>
<rect x="330" y="145" width="240" height="385" rx="10" fill="#f8fafc" stroke="#1f3a5f" stroke-width="2"/>
<text x="348" y="175" text-anchor="start" font-size="15" font-weight="700" fill="#1f3a5f">2  Depth by Radius</text>
<line x1="348" y1="189" x2="552" y2="189" stroke="#1f3a5f" stroke-width="1" opacity="0.35"/>
<rect x="610" y="145" width="240" height="385" rx="10" fill="#f8fafc" stroke="#1f3a5f" stroke-width="2"/>
<text x="628" y="175" text-anchor="start" font-size="15" font-weight="700" fill="#1f3a5f">3  Z-score Normalization</text>
<line x1="628" y1="189" x2="832" y2="189" stroke="#1f3a5f" stroke-width="1" opacity="0.35"/>
<rect x="890" y="145" width="240" height="385" rx="10" fill="#f8fafc" stroke="#1f3a5f" stroke-width="2"/>
<text x="908" y="175" text-anchor="start" font-size="15" font-weight="700" fill="#1f3a5f">4  Mean Aggregation</text>
<line x1="908" y1="189" x2="1112" y2="189" stroke="#1f3a5f" stroke-width="1" opacity="0.35"/>
<line x1="290" y1="340" x2="330" y2="340" stroke="#3b6ea8" stroke-width="2.5" marker-end="url(#arrow-primary)"/>
<line x1="570" y1="340" x2="610" y2="340" stroke="#3b6ea8" stroke-width="2.5" marker-end="url(#arrow-primary)"/>
<line x1="850" y1="340" x2="890" y2="340" stroke="#3b6ea8" stroke-width="2.5" marker-end="url(#arrow-primary)"/>
<path d="M 78 270 C 105 245, 125 255, 143 280 S 165 382, 185 393 S 220 278, 260 265" fill="none" stroke="#3b6ea8" stroke-width="3"/>
<circle cx="185" cy="393" r="5" fill="#1f3a5f"/>
<text x="104" y="246" text-anchor="start" font-size="12" font-weight="700" fill="#111827">p_L</text>
<text x="232" y="255" text-anchor="start" font-size="12" font-weight="700" fill="#111827">p_R</text>
<text x="193" y="416" text-anchor="start" font-size="12" font-weight="700" fill="#111827">S_i</text>
<text x="170" y="468" text-anchor="middle" font-size="12" font-weight="400" fill="#6b7280">one cohesion valley</text>
<rect x="350" y="210" width="200" height="30" rx="15" fill="#f8fafc" stroke="#1f3a5f" stroke-width="1.5"/>
<text x="450" y="230" text-anchor="middle" font-size="12" fill="#6b7280">R = {3, 5, 10, 15, 20}</text>
<text x="354" y="285" text-anchor="start" font-size="12" font-weight="700" fill="#111827">r = 3</text>
<path d="M 405 282 L 438 278 L 466 294 L 493 279 L 535 285" fill="none" stroke="#3b6ea8" stroke-width="2"/>
<text x="354" y="328" text-anchor="start" font-size="12" font-weight="700" fill="#111827">r = 5</text>
<path d="M 405 325 L 438 321 L 466 337 L 493 322 L 535 328" fill="none" stroke="#3b6ea8" stroke-width="2"/>
<text x="354" y="371" text-anchor="start" font-size="12" font-weight="700" fill="#111827">r = 10</text>
<path d="M 405 368 L 438 364 L 466 380 L 493 365 L 535 371" fill="none" stroke="#3b6ea8" stroke-width="2"/>
<text x="354" y="414" text-anchor="start" font-size="12" font-weight="700" fill="#111827">r = 15</text>
<path d="M 405 411 L 438 407 L 466 423 L 493 408 L 535 414" fill="none" stroke="#3b6ea8" stroke-width="2"/>
<text x="354" y="457" text-anchor="start" font-size="12" font-weight="700" fill="#111827">r = 20</text>
<path d="M 405 454 L 438 450 L 466 466 L 493 451 L 535 457" fill="none" stroke="#3b6ea8" stroke-width="2"/>
<text x="730" y="260" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">center</text>
<text x="730" y="315" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">then scale</text>
<line x1="660" y1="350" x2="800" y2="350" stroke="#1f3a5f" stroke-width="1.5" stroke-dasharray="5,4"/>
<text x="730" y="385" text-anchor="middle" font-size="12" font-weight="400" fill="#6b7280">per radius</text>
<line x1="930" y1="235" x2="1090" y2="235" stroke="#cbd5e1" stroke-width="1"/>
<circle cx="966" cy="235" r="5" fill="#3b6ea8"/>
<line x1="930" y1="280" x2="1090" y2="280" stroke="#cbd5e1" stroke-width="1"/>
<circle cx="988" cy="280" r="5" fill="#3b6ea8"/>
<line x1="930" y1="325" x2="1090" y2="325" stroke="#cbd5e1" stroke-width="1"/>
<circle cx="1010" cy="325" r="5" fill="#3b6ea8"/>
<line x1="930" y1="370" x2="1090" y2="370" stroke="#cbd5e1" stroke-width="1"/>
<circle cx="1032" cy="370" r="5" fill="#3b6ea8"/>
<line x1="930" y1="415" x2="1090" y2="415" stroke="#cbd5e1" stroke-width="1"/>
<circle cx="1054" cy="415" r="5" fill="#3b6ea8"/>
<line x1="1010" y1="445" x2="1010" y2="490" stroke="#3b6ea8" stroke-width="2"/>
<polygon points="1010,490 1004,478 1016,478" fill="#3b6ea8"/>
<text x="1010" y="510" text-anchor="middle" font-size="12" font-weight="400" fill="#6b7280">one aggregate profile</text>
<rect x="100" y="560" width="1000" height="30" rx="15" fill="#f8fafc" stroke="#1f3a5f" stroke-width="1.5"/>
<text x="600" y="580" text-anchor="middle" font-size="12" fill="#6b7280">D_r(i) = (p_L(i,r) + p_R(i,r) - 2S_i) / 2</text>
<rect x="100" y="610" width="1000" height="30" rx="15" fill="#f8fafc" stroke="#1f3a5f" stroke-width="1.5"/>
<text x="600" y="630" text-anchor="middle" font-size="12" fill="#6b7280">D_hat_r(i) = (D_r(i) - mu_r) / (sigma_r + epsilon)</text>
<rect x="100" y="660" width="1000" height="30" rx="15" fill="#f8fafc" stroke="#1f3a5f" stroke-width="1.5"/>
<text x="600" y="680" text-anchor="middle" font-size="12" fill="#6b7280">D_bar(i) = (1 / |R|) sum_{r in R} D_hat_r(i)</text>
</svg>
