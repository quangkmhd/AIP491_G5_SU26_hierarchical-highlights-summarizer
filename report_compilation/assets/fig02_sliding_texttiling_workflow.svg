<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Multi-Scale Sliding TextTiling</title>
<desc id="desc">Luồng xử lý theo lô và cửa sổ trượt của thuật toán phân đoạn chủ đề.</desc>
<defs>
