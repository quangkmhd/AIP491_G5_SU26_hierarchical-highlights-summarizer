<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="670" viewBox="0 0 1600 670" role="img" aria-labelledby="title desc">
<title id="title">Tích hợp ViT5 và BARTpho</title>
<desc id="desc">Kiến trúc tóm tắt phân cấp từ phân đoạn chủ đề đến tiêu đề.</desc>
<defs>
<marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#0077BB"/></marker>
<marker id="arrow-navy" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#17324D"/></marker>
<marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#EE7733"/></marker>
<marker id="arrow-gray" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#65717E"/></marker>
</defs>
<rect width="1600" height="670" fill="#FFFFFF"/>
<rect x="55" y="55" width="450" height="520" rx="14" fill="#F7FBFE" stroke="#C6CED6" stroke-width="1.5"/>
<circle cx="80" cy="80" r="15" fill="#17324D"/>
<text x="80" y="86" text-anchor="middle" font-family="Liberation Sans, Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">1</text>
<text x="104" y="86" text-anchor="start" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="700" fill="#17324D">Chuẩn bị các khối lượt lời</text>
<rect x="100" y="125" width="360" height="68" rx="10" fill="#FFFFFF" stroke="#17324D" stroke-width="1.7"/>
<text x="280.0" y="165.0" text-anchor="middle" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="600" fill="#17324D">
<tspan x="280.0" dy="0">Phân đoạn chủ đề Tₖ</tspan>
</text>
<path d="M280,193 L280,230" fill="none" stroke="#0077BB" stroke-width="2.2" marker-end="url(#arrow-blue)"/>
<text x="100" y="260" text-anchor="start" font-family="Liberation Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#65717E">CHIA TUẦN TỰ · TỐI ĐA 8 LƯỢT LỜI</text>
<rect x="100" y="280" width="100" height="76" rx="10" fill="#EAF4FB" stroke="#0077BB" stroke-width="1.7"/>
<text x="150.0" y="312.5" text-anchor="middle" font-family="Liberation Sans, Arial, sans-serif" font-size="16" font-weight="600" fill="#17324D">
<tspan x="150.0" dy="0">Cₖ,1</tspan>
<tspan x="150.0" dy="23">≤ 8</tspan>
</text>
<rect x="220" y="280" width="100" height="76" rx="10" fill="#EAF4FB" stroke="#0077BB" stroke-width="1.7"/>
<text x="270.0" y="312.5" text-anchor="middle" font-family="Liberation Sans, Arial, sans-serif" font-size="16" font-weight="600" fill="#17324D">
<tspan x="270.0" dy="0">Cₖ,2</tspan>
<tspan x="270.0" dy="23">≤ 8</tspan>
</text>
<rect x="340" y="280" width="100" height="76" rx="10" fill="#EAF4FB" stroke="#0077BB" stroke-width="1.7"/>
<text x="390.0" y="312.5" text-anchor="middle" font-family="Liberation Sans, Arial, sans-serif" font-size="16" font-weight="600" fill="#17324D">
<tspan x="390.0" dy="0">Cₖ,3</tspan>
<tspan x="390.0" dy="23">≤ 8</tspan>
</text>
<path d="M150,356 L150,405 L280,405" fill="none" stroke="#0077BB" stroke-width="2.2" marker-end="url(#arrow-blue)"/>
<path d="M270,356 L270,405 L280,405" fill="none" stroke="#0077BB" stroke-width="2.2" marker-end="url(#arrow-blue)"/>
<path d="M390,356 L390,405 L280,405" fill="none" stroke="#0077BB" stroke-width="2.2" marker-end="url(#arrow-blue)"/>
<rect x="100" y="405" width="360" height="105" rx="10" fill="#F5F7F9" stroke="#17324D" stroke-width="1.7"/>
<text x="280.0" y="452.0" text-anchor="middle" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="600" fill="#17324D">
<tspan x="280.0" dy="0">Định dạng đầu vào · tối đa 512 tokens</tspan>
<tspan x="280.0" dy="23">“Tóm tắt: [Speaker]: [Text] …”</tspan>
</text>
<rect x="545" y="55" width="450" height="520" rx="14" fill="#F6FCFA" stroke="#C6CED6" stroke-width="1.5"/>
<circle cx="570" cy="80" r="15" fill="#17324D"/>
<text x="570" y="86" text-anchor="middle" font-family="Liberation Sans, Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">2</text>
<text x="594" y="86" text-anchor="start" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="700" fill="#17324D">Tóm tắt từng khối bằng ViT5</text>
<rect x="605" y="140" width="330" height="100" rx="10" fill="#E8F7F4" stroke="#009988" stroke-width="1.7"/>
<text x="770.0" y="184.5" text-anchor="middle" font-family="Liberation Sans, Arial, sans-serif" font-size="19" font-weight="600" fill="#17324D">
<tspan x="770.0" dy="0">ViT5-base</tspan>
<tspan x="770.0" dy="23">Chunk Summarizer</tspan>
</text>
<text x="770" y="282" text-anchor="middle" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="400" fill="#65717E">áp dụng độc lập cho mỗi Cₖ,ⱼ</text>
<path d="M770,305 L770,350" fill="none" stroke="#009988" stroke-width="2.2" marker-end="url(#arrow-navy)"/>
<rect x="605" y="350" width="95" height="70" rx="10" fill="#FFFFFF" stroke="#009988" stroke-width="1.7"/>
<text x="652.5" y="391.0" text-anchor="middle" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="600" fill="#17324D">
<tspan x="652.5" dy="0">qₖ,1</tspan>
</text>
<rect x="720" y="350" width="95" height="70" rx="10" fill="#FFFFFF" stroke="#009988" stroke-width="1.7"/>
<text x="767.5" y="391.0" text-anchor="middle" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="600" fill="#17324D">
<tspan x="767.5" dy="0">qₖ,2</tspan>
</text>
<rect x="835" y="350" width="95" height="70" rx="10" fill="#FFFFFF" stroke="#009988" stroke-width="1.7"/>
<text x="882.5" y="391.0" text-anchor="middle" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="600" fill="#17324D">
<tspan x="882.5" dy="0">qₖ,3</tspan>
</text>
<text x="770" y="465" text-anchor="middle" font-family="Liberation Sans, Arial, sans-serif" font-size="19" font-weight="700" fill="#009988">qₖ,₁  /  qₖ,₂  /  …  /  qₖ,ₘ</text>
<rect x="605" y="495" width="330" height="48" rx="10" fill="#F5F7F9" stroke="#17324D" stroke-width="1.7"/>
<text x="770.0" y="525.0" text-anchor="middle" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="600" fill="#17324D">
<tspan x="770.0" dy="0">Ghép bằng chuỗi phân tách “ / ”</tspan>
</text>
<rect x="1035" y="55" width="510" height="520" rx="14" fill="#FFFAF6" stroke="#C6CED6" stroke-width="1.5"/>
<circle cx="1060" cy="80" r="15" fill="#17324D"/>
<text x="1060" y="86" text-anchor="middle" font-family="Liberation Sans, Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">3</text>
<text x="1084" y="86" text-anchor="start" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="700" fill="#17324D">Tạo tiêu đề chủ đề bằng BARTpho</text>
<rect x="1090" y="125" width="400" height="76" rx="10" fill="#FFF2E8" stroke="#EE7733" stroke-width="1.7"/>
<text x="1290.0" y="157.5" text-anchor="middle" font-family="Liberation Sans, Arial, sans-serif" font-size="16" font-weight="600" fill="#17324D">
<tspan x="1290.0" dy="0">Giữ tối đa 1.500 ký tự cuối</tspan>
<tspan x="1290.0" dy="23">và tối đa 1.024 tokens</tspan>
</text>
<path d="M1290,201 L1290,235" fill="none" stroke="#EE7733" stroke-width="2.2" marker-end="url(#arrow-orange)"/>
<rect x="1090" y="235" width="400" height="66" rx="10" fill="#FFFFFF" stroke="#EE7733" stroke-width="1.7"/>
<text x="1290.0" y="274.0" text-anchor="middle" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="600" fill="#17324D">
<tspan x="1290.0" dy="0">“Tạo tiêu đề: …”</tspan>
</text>
<path d="M1290,301 L1290,335" fill="none" stroke="#EE7733" stroke-width="2.2" marker-end="url(#arrow-orange)"/>
<rect x="1090" y="335" width="400" height="92" rx="10" fill="#FFF2E8" stroke="#EE7733" stroke-width="1.7"/>
<text x="1290.0" y="375.5" text-anchor="middle" font-family="Liberation Sans, Arial, sans-serif" font-size="19" font-weight="600" fill="#17324D">
<tspan x="1290.0" dy="0">BARTpho-syllable-base</tspan>
<tspan x="1290.0" dy="23">Topic Titler</tspan>
</text>
<path d="M1290,427 L1290,465" fill="none" stroke="#EE7733" stroke-width="2.2" marker-end="url(#arrow-orange)"/>
<rect x="1090" y="465" width="400" height="78" rx="10" fill="#FFFFFF" stroke="#CC3311" stroke-width="1.7"/>
<text x="1290.0" y="510.0" text-anchor="middle" font-family="Liberation Sans, Arial, sans-serif" font-size="20" font-weight="600" fill="#17324D">
<tspan x="1290.0" dy="0">Tiêu đề chủ đề hₖ</tspan>
</text>
<path d="M505,315 L545,315" fill="none" stroke="#0077BB" stroke-width="2.2" marker-end="url(#arrow-blue)"/>
<path d="M995,315 L1035,315" fill="none" stroke="#EE7733" stroke-width="2.2" marker-end="url(#arrow-orange)"/>
<text x="55" y="630" text-anchor="start" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" fill="#65717E">Đơn vị đầu vào</text>
<text x="545" y="630" text-anchor="start" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" fill="#009988">Tầng tóm tắt cục bộ</text>
<text x="1035" y="630" text-anchor="start" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" fill="#EE7733">Tầng tổng hợp chủ đề</text>
</svg>
