<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620">
<style>
text { font-family: Arial, Helvetica, sans-serif; }
</style>
<defs>
<marker id="arrow-primary" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0,0 10,4 0,8" fill="#3b6ea8"/></marker>
<marker id="arrow-output" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0,0 10,4 0,8" fill="#2e7d32"/></marker>
</defs>
<rect width="1200" height="620" fill="#ffffff"/>
<text x="60" y="58" font-size="28" font-weight="700" fill="#111827">MODULE 4 — TOPIC SEGMENTATION</text>
<text x="60" y="88" font-size="17" fill="#6b7280">Adaptive candidate selection</text>
<line x1="60" y1="108" x2="1140" y2="108" stroke="#1f3a5f" stroke-width="2"/>
<rect x="55" y="150" width="520" height="370" rx="10" fill="#f8fafc" stroke="#1f3a5f" stroke-width="2"/>
<text x="73" y="180" text-anchor="start" font-size="18" font-weight="700" fill="#1f3a5f">Input — Aggregated Depth</text>
<line x1="73" y1="194" x2="557" y2="194" stroke="#1f3a5f" stroke-width="1" opacity="0.35"/>
<rect x="625" y="175" width="230" height="105" rx="10" fill="#f8fafc" stroke="#1f3a5f" stroke-width="2"/>
<circle cx="647" cy="197" r="13" fill="#1f3a5f" data-step="1"/>
<text x="647" y="202" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">1</text>
<text x="740" y="230" text-anchor="middle" font-size="14" font-weight="700" fill="#111827"><tspan x="740" dy="0">Mean and Standard </tspan><tspan x="740" dy="18">Deviation</tspan></text>
<text x="740" y="274" text-anchor="middle" font-size="13" font-weight="400" fill="#6b7280">local statistics</text>
<rect x="625" y="335" width="230" height="95" rx="10" fill="#f8fafc" stroke="#1f3a5f" stroke-width="2"/>
<circle cx="647" cy="357" r="13" fill="#1f3a5f" data-step="2"/>
<text x="647" y="362" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">2</text>
<text x="740" y="390" text-anchor="middle" font-size="14" font-weight="700" fill="#111827"><tspan x="740" dy="0">tau = mu + alpha sigma</tspan></text>
<text x="740" y="416" text-anchor="middle" font-size="13" font-weight="400" fill="#6b7280">local threshold</text>
<rect x="930" y="175" width="220" height="115" rx="10" fill="#f8fafc" stroke="#1f3a5f" stroke-width="2"/>
<circle cx="952" cy="197" r="13" fill="#1f3a5f" data-step="3"/>
<text x="952" y="202" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">3</text>
<text x="1040" y="230" text-anchor="middle" font-size="14" font-weight="700" fill="#111827"><tspan x="1040" dy="0">Candidate </tspan><tspan x="1040" dy="18">Selection</tspan></text>
<text x="1040" y="274" text-anchor="middle" font-size="13" font-weight="400" fill="#6b7280">depth &gt; threshold</text>
<rect x="930" y="395" width="220" height="100" rx="10" fill="#f0fdf4" stroke="#2e7d32" stroke-width="2"/>
<text x="948" y="426" text-anchor="start" font-size="16" font-weight="700" fill="#111827"><tspan x="948" dy="0">Candidate Set</tspan></text>
<text x="948" y="452" text-anchor="start" font-size="13" font-weight="400" fill="#6b7280">accepted boundary indices</text>
<line x1="575" y1="228" x2="625" y2="228" stroke="#3b6ea8" stroke-width="2.5" marker-end="url(#arrow-primary)"/>
<line x1="740" y1="280" x2="740" y2="335" stroke="#3b6ea8" stroke-width="2.5" marker-end="url(#arrow-primary)"/>
<line x1="855" y1="382" x2="900" y2="382" stroke="#3b6ea8" stroke-width="2.5" marker-end="url(#arrow-primary)"/>
<path d="M 900 382 L 900 232 L 930 232" fill="none" stroke="#3b6ea8" stroke-width="2.5" marker-end="url(#arrow-primary)"/>
<line x1="1040" y1="290" x2="1040" y2="395" stroke="#2e7d32" stroke-width="2.5" marker-end="url(#arrow-output)"/>
<line x1="92" y1="430" x2="540" y2="430" stroke="#1f3a5f" stroke-width="1.5"/>
<line x1="92" y1="325" x2="540" y2="325" stroke="#1f3a5f" stroke-width="1.5" stroke-dasharray="7,5"/>
<text x="98" y="313" text-anchor="start" font-size="12" font-weight="400" fill="#6b7280">threshold</text>
<path d="M 92 405 L 135 390 L 175 360 L 220 250 L 265 374 L 310 342 L 355 285 L 400 365 L 445 345 L 490 352 L 540 395" fill="none" stroke="#3b6ea8" stroke-width="3"/>
<circle cx="220" cy="250" r="7" fill="#1f3a5f" data-profile-state="accepted" data-index="4"/>
<circle cx="355" cy="285" r="7" fill="#1f3a5f" data-profile-state="accepted" data-index="7"/>
<circle cx="310" cy="342" r="7" fill="#ffffff" stroke="#6b7280" stroke-width="2" data-profile-state="rejected" data-index="6"/>
<text x="220" y="232" text-anchor="middle" font-size="12" font-weight="700" fill="#111827">Accepted</text>
<text x="310" y="368" text-anchor="middle" font-size="12" font-weight="400" fill="#6b7280">Rejected</text>
<circle cx="1010" cy="468" r="15" fill="#f0fdf4" stroke="#2e7d32" stroke-width="1.5" data-candidate-index="4"/>
<text x="1010" y="473" text-anchor="middle" font-size="12" font-weight="700" fill="#111827">4</text>
<circle cx="1070" cy="468" r="15" fill="#f0fdf4" stroke="#2e7d32" stroke-width="1.5" data-candidate-index="7"/>
<text x="1070" y="473" text-anchor="middle" font-size="12" font-weight="700" fill="#111827">7</text>
</svg>
