<rect width="1200" height="620" fill="#ffffff"/>
<text x="60" y="58" font-size="22" font-weight="700" fill="#111827">MODULE 4 — TOPIC SEGMENTATION</text>
<text x="60" y="86" font-size="14" fill="#6b7280">Adaptive candidate selection</text>
