<text x="48" y="206" text-anchor="start" font-size="16" font-weight="700" fill="#111827"><tspan x="48" dy="0">Speaker-labelled </tspan><tspan x="48" dy="18">Utterances</tspan></text>
<rect x="205" y="175" width="165" height="120" rx="10" fill="#f8fafc" stroke="#1f3a5f" stroke-width="2"/>
<circle cx="227" cy="197" r="13" fill="#1f3a5f" data-step="1"/>
<text x="227" y="202" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">1</text>
<text x="287" y="230" text-anchor="middle" font-size="14" font-weight="700" fill="#111827"><tspan x="287" dy="0">Task </tspan><tspan x="287" dy="18">Formatting</tspan></text>
<rect x="400" y="175" width="165" height="120" rx="10" fill="#f8fafc" stroke="#1f3a5f" stroke-width="2"/>
<circle cx="422" cy="197" r="13" fill="#1f3a5f" data-step="2"/>
<text x="422" y="202" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">2</text>
<text x="482" y="230" text-anchor="middle" font-size="14" font-weight="700" fill="#111827"><tspan x="482" dy="0">Tokenization</tspan></text>
<rect x="595" y="175" width="165" height="120" rx="10" fill="#f8fafc" stroke="#1f3a5f" stroke-width="2"/>
<circle cx="617" cy="197" r="13" fill="#1f3a5f" data-step="3"/>
<text x="617" y="202" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">3</text>
<text x="677" y="230" text-anchor="middle" font-size="14" font-weight="700" fill="#111827"><tspan x="677" dy="0">Fine-tuned </tspan><tspan x="677" dy="18">ViT5-base</tspan></text>
<rect x="790" y="175" width="165" height="120" rx="10" fill="#f8fafc" stroke="#1f3a5f" stroke-width="2"/>
<circle cx="812" cy="197" r="13" fill="#1f3a5f" data-step="4"/>
<text x="812" y="202" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">4</text>
<text x="872" y="230" text-anchor="middle" font-size="14" font-weight="700" fill="#111827"><tspan x="872" dy="0">Store and </tspan><tspan x="872" dy="18">Emit</tspan></text>
<rect x="985" y="175" width="185" height="120" rx="10" fill="#f0fdf4" stroke="#2e7d32" stroke-width="2"/>
<text x="1003" y="206" text-anchor="start" font-size="16" font-weight="700" fill="#111827"><tspan x="1003" dy="0">Emitted Chunk </tspan><tspan x="1003" dy="18">Summary</tspan></text>
<line x1="175" y1="235" x2="205" y2="235" stroke="#3b6ea8" stroke-width="2.5" marker-end="url(#arrow-primary)"/>
<line x1="370" y1="235" x2="400" y2="235" stroke="#3b6ea8" stroke-width="2.5" marker-end="url(#arrow-primary)"/>
<line x1="565" y1="235" x2="595" y2="235" stroke="#3b6ea8" stroke-width="2.5" marker-end="url(#arrow-primary)"/>
