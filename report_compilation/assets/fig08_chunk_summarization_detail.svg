<line x1="68" y1="434" x2="1132" y2="434" stroke="#1f3a5f" stroke-width="1" opacity="0.35"/>
<g data-constraint-footer="vit5">
<rect x="105" y="460" width="190" height="34" rx="17" fill="#f8fafc" stroke="#1f3a5f" stroke-width="1.5"/>
<text x="200" y="483" text-anchor="middle" font-size="14" fill="#6b7280">max input: 512 tokens</text>
<rect x="305" y="460" width="150" height="34" rx="17" fill="#f8fafc" stroke="#1f3a5f" stroke-width="1.5"/>
<text x="380" y="483" text-anchor="middle" font-size="14" fill="#6b7280">beam size: 4</text>
<rect x="465" y="460" width="150" height="34" rx="17" fill="#f8fafc" stroke="#1f3a5f" stroke-width="1.5"/>
<text x="540" y="483" text-anchor="middle" font-size="14" fill="#6b7280">no sampling</text>
<rect x="625" y="460" width="190" height="34" rx="17" fill="#f8fafc" stroke="#1f3a5f" stroke-width="1.5"/>
<text x="720" y="483" text-anchor="middle" font-size="14" fill="#6b7280">no-repeat 3-gram</text>
<rect x="825" y="460" width="230" height="34" rx="17" fill="#f8fafc" stroke="#1f3a5f" stroke-width="1.5"/>
<text x="940" y="483" text-anchor="middle" font-size="14" fill="#6b7280">max output: 128 tokens</text>
</g>
