<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1700 600" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .navy-border { stroke: #0f2b48; stroke-width: 3.5; fill: #ffffff; }
      .green-border { stroke: #196c2e; stroke-width: 3.5; fill: #ffffff; }
      .navy-text { fill: #0f2b48; font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; text-anchor: middle; }
      .title-text { font-size: 25px; font-weight: 800; letter-spacing: 0.8px; }
      .box-header { font-size: 24px; font-weight: 800; letter-spacing: 0.5px; }
      .step-num { font-size: 32px; font-weight: 800; }
      .sub-text { font-size: 21px; font-weight: 700; }
      .sub-text-small { font-size: 20px; font-weight: 700; }
      .arrow-line { stroke: #0f2b48; stroke-width: 3.5; stroke-linecap: round; }
    </style>
    <marker id="arrowhead" markerWidth="14" markerHeight="10" refX="13" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <polygon points="0 0, 14 5, 0 10" fill="#0f2b48" />
    </marker>
  </defs>

  <!-- Background -->
  <rect class="bg" width="1700" height="600" />

  <!-- INPUT Box -->
  <rect class="navy-border" x="60" y="190" width="160" height="280" rx="18" ry="18" />
  <text class="navy-text box-header" x="140" y="310">INPUT</text>
  <text class="navy-text sub-text-small" x="140" y="355" font-weight="600">Audio Stream</text>

  <!-- Arrow 1: INPUT to Main Box -->
  <line class="arrow-line" x1="220" y1="330" x2="267" y2="330" marker-end="url(#arrowhead)" />

  <!-- Main Pipeline Container Outer Box -->
  <rect class="navy-border" x="270" y="80" width="1160" height="440" rx="24" ry="24" />
  <text class="navy-text title-text" x="850" y="145">A SPEECH-TO-SUMMARY PIPELINE FOR VIETNAMESE ONLINE MEETINGS</text>

  <!-- Module 1: Audio Preprocessing -->
  <rect class="navy-border" x="330" y="190" width="180" height="280" rx="18" ry="18" />
  <text class="navy-text step-num" x="420" y="255">1</text>
  <text class="navy-text sub-text" x="420" y="330">Audio</text>
  <text class="navy-text sub-text" x="420" y="365">Preprocessing</text>

  <!-- Arrow: Module 1 to Module 2 -->
  <line class="arrow-line" x1="510" y1="330" x2="542" y2="330" marker-end="url(#arrowhead)" />

  <!-- Module 2: Speaker Diarization -->
  <rect class="navy-border" x="545" y="190" width="180" height="280" rx="18" ry="18" />
  <text class="navy-text step-num" x="635" y="255">2</text>
  <text class="navy-text sub-text" x="635" y="330">Speaker</text>
  <text class="navy-text sub-text" x="635" y="365">Diarization</text>

  <!-- Arrow: Module 2 to Module 3 -->
  <line class="arrow-line" x1="725" y1="330" x2="757" y2="330" marker-end="url(#arrowhead)" />

  <!-- Module 3: Automatic Speech Recognition -->
  <rect class="navy-border" x="760" y="190" width="180" height="280" rx="18" ry="18" />
  <text class="navy-text step-num" x="850" y="255">3</text>
  <text class="navy-text sub-text-small" x="850" y="315">Automatic</text>
  <text class="navy-text sub-text-small" x="850" y="345">Speech</text>
  <text class="navy-text sub-text-small" x="850" y="375">Recognition</text>

  <!-- Arrow: Module 3 to Module 4 -->
  <line class="arrow-line" x1="940" y1="330" x2="972" y2="330" marker-end="url(#arrowhead)" />

  <!-- Module 4: Topic Segmentation -->
  <rect class="navy-border" x="975" y="190" width="180" height="280" rx="18" ry="18" />
  <text class="navy-text step-num" x="1065" y="255">4</text>
  <text class="navy-text sub-text" x="1065" y="330">Topic</text>
  <text class="navy-text sub-text" x="1065" y="365">Segmentation</text>

  <!-- Arrow: Module 4 to Module 5 -->
  <line class="arrow-line" x1="1155" y1="330" x2="1187" y2="330" marker-end="url(#arrowhead)" />

  <!-- Module 5: Hierarchical Summarization -->
  <rect class="navy-border" x="1190" y="190" width="180" height="280" rx="18" ry="18" />
  <text class="navy-text step-num" x="1280" y="255">5</text>
  <text class="navy-text sub-text" x="1280" y="330">Hierarchical</text>
  <text class="navy-text sub-text" x="1280" y="365">Summarization</text>

  <!-- Arrow 2: Main Box to OUTPUT -->
  <line class="arrow-line" x1="1430" y1="330" x2="1477" y2="330" marker-end="url(#arrowhead)" />

  <!-- OUTPUT Box -->
  <rect class="green-border" x="1480" y="190" width="160" height="280" rx="18" ry="18" />
  <text class="navy-text box-header" x="1560" y="295">OUTPUT</text>
  <text class="navy-text sub-text-small" x="1560" y="340" font-weight="600">Hierarchical</text>
  <text class="navy-text sub-text-small" x="1560" y="375" font-weight="600">Meeting Recap</text>
</svg>
