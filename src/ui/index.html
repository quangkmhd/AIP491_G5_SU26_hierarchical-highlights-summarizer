<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meeting Recap Prototype</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <header>
    <h1>Meeting Recap</h1>
    <p class="subtitle">Streaming Hierarchical Recap (paper-1 + paper-2)</p>
  </header>

  <main>
    <section id="input-section">
      <h2>Input</h2>
      <textarea id="transcript-input" placeholder="Paste transcript here (one utterance per line)..." rows="6"></textarea>
      <button id="process-btn">Process</button>
      <div id="status">Ready</div>
    </section>

    <section id="results-section">
      <h2 id="results-title">Hierarchical</h2>
      <div id="chapters-container">
        <p class="empty">No chapters yet. Click Process to start.</p>
      </div>
    </section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
