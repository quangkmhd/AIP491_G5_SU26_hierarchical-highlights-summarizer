hierarchical_title: |
  Bạn đang thực hiện viết title cho một đoạn của cuộc họp.

  Mục tiêu:
  - Đặt tiêu đề ngắn cho đoạn hội thoại.
  - Tiêu đề và tóm tắt phải giúp người đọc scan lại diễn biến cuộc họp theo dòng thời gian.

  Quy tắc:
  - `title` dài 4-10 từ tiếng Việt, cụ thể theo chủ đề chapter, không dùng tiêu đề chung chung như "Thảo luận cuộc họp" nếu có thông tin cụ thể hơn.
  - `one_line_summary` là đúng một câu tiếng Việt, tối đa ~35 từ, viết ở ngôi thứ ba, nêu chủ đề chính/quyết định/hướng trao đổi nổi bật.
  - KHÔNG dùng "S0", "S1" trong `one_line_summary`. Ví dụ đúng: "Một người đề xuất đi uống bia nhưng người kia từ chối vì lý do sức khỏe."
  - Nếu không có nội dung rõ cho `title` hoặc `one_line_summary`, ghi "none".

  Input file: {input_name}
  Chapter number: {chapter_number}

  Segment utterances:
  {segment_utterances}

  Return strict JSON only:
  {{
    "title": "tiêu đề chapter ngắn gọn bằng tiếng Việt",
    "one_line_summary": "một câu tóm tắt chapter bằng tiếng Việt"
  }}



hierarchical_abstractive: |
  Bạn đang thực hiện tóm tắt cho một đoạn hội thoại của cuộc họp.

  Mục tiêu:
  - Tạo tóm tắt chi tiết theo từng đoạn hội thoại
  - Đoạn hội thoại phải có một ghi chú ngắn, factual, giữ đúng mạch thời gian.

  Quy tắc coverage:
  - Trả về đúng một note cho mỗi đoạn hội thoại.
  - Nếu không có nội dung rõ cho `summary`, ghi "none".

  Quy tắc viết nội dung:
  - `summary` viết bằng tiếng Việt, ngôi thứ ba, 1-3 câu, phản ánh nội dung chính của đoạn hội thoại.
    - Dùng "một người", "người kia", "người nói thứ nhất", "người nói thứ hai" hoặc diễn đạt theo ngữ cảnh.
    - Ví dụ: "Một người đề nghị đi uống bia, nhưng người kia từ chối vì sức khỏe và đề xuất đi dạo đến phòng tập."
  - Giữ speaker names, model names, APIs, metrics, file paths, timestamps, và thuật ngữ kỹ thuật nếu chúng là thông tin quan trọng.
  - Không thêm thông tin ngoài chunk. Chỉ dùng các utterances trong chunk tương ứng để viết note của chunk đó.

  Input file: {input_name}
  Chapter number: {chapter_number}

  8-utterance chunks:
  {prompt_chunks}

  Return strict JSON only:
  {{
    "notes": [
      {{
        "chunk_id": "{example_chunk_id}",
        "summary": "Ghi chú factual 1-3 câu bằng tiếng Việt cho đúng chunk này."
      }}
    ]
  }}
