[project]
name = "meeting-recap"
version = "0.1.0"
description = "LLM-Powered Hierarchical Meeting Recap System with Topic Segmentation"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.6.0",
    "transformers>=5.12.0",
    "sentencepiece>=0.2.0",
    "protobuf>=5.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0,<3.0",
    "stopwordsiso>=0.7.1",
    "numpy>=1.24.0",
    "fastapi>=0.139.0",
    "uvicorn[standard]>=0.51.0",
    "websockets>=13.0",
    "sse-starlette>=3.4.5",
    "sherpa-onnx>=1.12.0",
    "torchaudio>=2.6.0",
    "onnxruntime-gpu>=1.20.0",
    "soundfile>=0.14.0",
    "soxr>=1.0.0",
    "deepfilternet>=0.5.6",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6.0",
    "playwright>=1.61.0",
    "httpx>=0.28.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

