[project]
name = "meeting-recap"
version = "0.1.0"
description = "LLM-Powered Hierarchical Meeting Recap System with Topic Segmentation"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.6.0",
    "transformers>=5.12.0",
    "bitsandbytes>=0.49.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0,<3.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
