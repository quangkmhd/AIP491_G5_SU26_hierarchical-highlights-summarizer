[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "coherence-meeting-recap"
version = "0.1.0"
description = "Coherence-enhanced meeting recap system — combining neural utterance-pair coherence scoring with LLM-powered hierarchical meeting summarization"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Research Team" }
]
keywords = ["dialogue-topic-segmentation", "meeting-recap", "coherence-scoring", "nlp", "summarization"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # Core NLP/ML
    "torch>=2.0.0,<2.6.0",
    "transformers>=4.30.0,<4.50.0",
    "datasets>=2.14.0,<3.0.0",
    "sentencepiece>=0.1.99",
    "nltk>=3.8.0",
    "spacy>=3.7.0",
    "scikit-learn>=1.3.0",

    # Evaluation metrics
    "rouge-score>=0.1.2",
    "bert-score>=0.3.13",
    "segeval>=0.1.0",

    # Data processing
    "pandas>=2.0.0",
    "numpy>=1.24.0,<2.0.0",
    "tqdm>=4.65.0",

    # PDF processing (for paper conversion)
    "markitdown>=0.0.1a3",
    "pdfplumber>=0.10.0",
    "pillow>=10.0.0",

    # Utilities
    "python-dotenv>=1.0.0",
    "click>=8.1.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4.0",
    "mypy>=1.8.0",
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "types-tqdm",
    "types-pyyaml",
    "types-requests",
]

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "references/**",
    "outputs/**",
    "docs/generated/**",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "T20", # flake8-print
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
]
fixable = ["ALL"]
unfixable = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.mypy]
python_version = "3.10"
strict = true
strict_optional = true
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
show_error_codes = true
pretty = true
exclude = [
    "references/",
    "outputs/",
    "docs/",
]

[[tool.mypy.overrides]]
module = [
    "rouge_score.*",
    "bert_score.*",
    "segeval.*",
    "markitdown.*",
    "pdfplumber.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = [
    "-ra",
    "-q",
    "--strict-markers",
    "--tb=short",
]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

[tool.coverage.run]
source = ["src"]
branch = true
omit = [
    "*/tests/*",
    "*/__init__.py",
]

[tool.coverage.report]
fail_under = 60
show_missing = true
skip_covered = false
sort = "Cover"
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]